name: Validate skill and synthetic fixtures
on:
  push:
  pull_request:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate skill structure
        run: python scripts/validate.py
      - name: Check synthetic calculations
        run: python scripts/check_calculations.py
      - name: Unit tests
        run: python -m unittest discover -s tests -v
